# Builds the one file a player double-clicks: AdvancedRandomizer.exe
#
# The compiler is csc.exe, which ships inside Windows itself, so this job needs
# no .NET SDK and the result needs no runtime download: it runs on the .NET
# Framework every Windows 10 already has.  The exe is only a bootstrapper - the
# window, the decisions and the Russian text stay in launcher\start, which is
# versioned and covered by tests.
#
# The exe is COMMITTED BACK to the repository root.  That is deliberate: the
# player pulls this repository and must find the launcher where they look for
# it, not in a release page they were never told about.  Releases still get the
# same file as a one-click download.
name: Launcher exe

on:
  push:
    branches: [main]
    paths:
      - "launcher/build/**"
      - "launcher/start/**"
      - ".github/workflows/launcher-release.yml"
  tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile AdvancedRandomizer.exe
        shell: pwsh
        run: |
          # The job log host is not reachable from every environment, so the
          # compiler's own words are emitted as ::error:: annotations: those are
          # readable through the checks API even when the log is not.
          $ErrorActionPreference = 'Continue'
          $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $csc)) {
            $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          }
          Write-Host "using compiler: $csc"
          if (-not (Test-Path -LiteralPath $csc)) {
            Write-Host "::error::csc.exe not found at $csc"
            exit 1
          }
          $here = (Get-Location).Path
          $source = Join-Path $here 'launcher\build\Program.cs'
          $output = Join-Path $here 'AdvancedRandomizer.exe'
          Write-Host "source: $source"
          Write-Host "output: $output"
          $text = & $csc /nologo /target:winexe /r:System.dll /r:System.Windows.Forms.dll "/out:$output" $source 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $text
          if ($code -ne 0) {
            $first = ($text -split "`n" | Where-Object { $_ -match 'error|fatal' } | Select-Object -First 5) -join ' | '
            if (-not $first) { $first = ($text -split "`n" | Select-Object -First 5) -join ' | ' }
            Write-Host "::error::csc exit ${code}: $first"
            exit $code
          }
          if (-not (Test-Path -LiteralPath $output)) {
            Write-Host "::error::csc reported success but $output is missing"
            exit 1
          }
          Get-Item $output | Format-List Name, Length, LastWriteTime

      - name: Commit the exe to the repository
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $exe = 'AdvancedRandomizer.exe'
          $changed = $false
          if (git status --porcelain -- $exe) { $changed = $true }
          if (-not $changed) {
            Write-Host 'the committed exe already matches this build'
          } else {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- $exe
            git commit -m 'Rebuild AdvancedRandomizer.exe'
            if ($LASTEXITCODE -ne 0) { Write-Host '::error::git commit failed'; exit 1 }
            git push
            if ($LASTEXITCODE -ne 0) { Write-Host '::error::git push failed'; exit 1 }
            Write-Host "committed $exe"
          }

      - name: Assemble the player's download
        shell: pwsh
        run: |
          $stage = 'dist/AdvancedRandomizer'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item AdvancedRandomizer.exe $stage
          Copy-Item launcher -Destination $stage -Recurse
          Copy-Item README.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath dist/AdvancedRandomizer-windows.zip -Force
          Get-Item dist/AdvancedRandomizer-windows.zip | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: AdvancedRandomizer-windows
          path: |
            AdvancedRandomizer.exe
            dist/AdvancedRandomizer-windows.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          # `gh release view` fails for a tag with no release yet; that is the
          # expected case here, so the exit code is inspected, not propagated.
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed: $LASTEXITCODE" }
          }
          gh release upload $tag AdvancedRandomizer.exe dist/AdvancedRandomizer-windows.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed: $LASTEXITCODE" }
